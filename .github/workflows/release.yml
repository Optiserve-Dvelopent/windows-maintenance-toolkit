name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create ZIP
        run: |
          mkdir release
          cp optimize.ps1 release/
          cp README.md release/
          cp LICENSE release/

          cd release
          zip -r ../windows-maintenance-toolkit-${GITHUB_REF_NAME}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            windows-maintenance-toolkit-${{ github.ref_name }}.zip